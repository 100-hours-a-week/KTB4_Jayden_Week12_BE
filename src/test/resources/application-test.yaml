spring:
  config:
    activate:
      on-profile: test
    import: optional:file:.env[.properties]

  test:
    database:
      replace: none

  jpa:
    open-in-view: false

    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.example.spring_rest_api: DEBUG
    org.hibernate.SQL: DEBUG

app:
  upload:
    root: ${user.dir}/uploads

decorator:
  datasource:
    p6spy:
      enable-logging: true
      logging: slf4j
      multiline: true

