spring:
  application:
    name: hobbyloop

  profiles:
    default: local

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

server:
  shutdown: graceful

app:
  outbox:
    worker-id: ${HOSTNAME:${random.uuid}}
    batch-size: 50
    poll-delay-ms: 500
    lock-timeout-seconds: 120