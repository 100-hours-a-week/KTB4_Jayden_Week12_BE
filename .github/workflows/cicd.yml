name: Backend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: hobbyloop_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options:
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SPRING_PROFILES_ACTIVE: test,test-mysql
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/hobbyloop_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      TEST_DB_USERNAME: test_user
      TEST_DB_PASSWORD: test_password

    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6

      - name: Build and test
        run: ./gradlew clean build --no-daemon

  publish:
    name: Publish backend image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/hobbyloop-backend:latest
            ${{ vars.DOCKERHUB_USERNAME }}/hobbyloop-backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy backend to EC2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Send deployment command
        id: send-command
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_REF: ${{ vars.DOCKERHUB_USERNAME }}/hobbyloop-backend:sha-${{ github.sha }}
        run: |
          set -euo pipefail

          parameters=$(jq -cn \
            --arg command "cd /opt/hobbyloop && ./deploy-service.sh backend $IMAGE_REF" \
            '{commands: [$command]}')

          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy backend ${GITHUB_SHA}" \
            --timeout-seconds 300 \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text \
            --no-cli-pager)

          if [ -z "$command_id" ] || [ "$command_id" = "None" ]; then
            echo "SSM did not return a command ID." >&2
            exit 1
          fi

          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment result
        env:
          COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 360))
          terminal_status=false
          invocation=''
          error_file=$(mktemp)
          trap 'rm -f "$error_file"' EXIT

          while [ "$SECONDS" -lt "$deadline" ]; do
            if invocation=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --output json \
              --no-cli-pager 2>"$error_file"); then
              status=$(jq -r '.Status' <<< "$invocation")
              status_details=$(jq -r '.StatusDetails' <<< "$invocation")
              echo "SSM command status: $status ($status_details)"

              case "$status" in
                Pending|InProgress|Delayed|Cancelling)
                  sleep 5
                  ;;
                Success|Cancelled|TimedOut|Failed)
                  terminal_status=true
                  break
                  ;;
                *)
                  echo "Unexpected SSM command status: $status" >&2
                  exit 1
                  ;;
              esac
            elif grep -q 'InvocationDoesNotExist' "$error_file"; then
              echo "Waiting for the SSM command invocation to become available."
              sleep 5
            else
              cat "$error_file" >&2
              exit 1
            fi
          done

          if [ "$terminal_status" != "true" ]; then
            echo "Timed out waiting for the SSM deployment command." >&2
            exit 1
          fi

          standard_output=$(jq -r '.StandardOutputContent // ""' <<< "$invocation")
          standard_error=$(jq -r '.StandardErrorContent // ""' <<< "$invocation")
          response_code=$(jq -r '.ResponseCode' <<< "$invocation")

          if [ -n "$standard_output" ]; then
            printf '%s\n' '--- SSM standard output ---' "$standard_output"
          fi

          if [ -n "$standard_error" ]; then
            printf '%s\n' '--- SSM standard error ---' "$standard_error" >&2
          fi

          if [ "$status" != "Success" ] || [ "$response_code" -ne 0 ]; then
            echo "Deployment failed with status=$status response_code=$response_code." >&2
            exit 1
          fi
