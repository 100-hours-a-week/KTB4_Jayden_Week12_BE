services:
  backend:
    image: ${BACKEND_IMAGE:-jhjhkkk/hobbyloop-backend:latest}
    container_name: hobbyloop-backend
    restart: unless-stopped

    env_file:
      - .env.prod
    environment:
      SERVER_ADDRESS: 0.0.0.0
    expose:
      - "8080"
    volumes:
      - uploads-data:/var/lib/hobbyloop/uploads

    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - app-network

  frontend:
    image: jhjhkkk/hobbyloop-frontend:latest
    container_name: hobbyloop-frontend

    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    networks:
      - app-network

volumes:
  uploads-data:

networks:
  app-network:
    driver: bridge
